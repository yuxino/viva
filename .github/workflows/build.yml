name: Build

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v2
        with:
          version: 11.24.0
          runtime: node@24.20.0
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      - name: Test release validation and updater signatures
        run: pnpm test:release

      - name: Build frontend
        run: pnpm build

      - name: Enforce renderer size budget
        run: pnpm check:size

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Test native core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check native application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint native application
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build desktop binary
        if: matrix.os != 'windows-2025'
        run: pnpm tauri build --no-bundle

      - name: Build Windows NSIS installer
        if: matrix.os == 'windows-2025'
        run: pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload Windows NSIS installer
        if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@v7
        with:
          name: viva-windows-x64-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
