name: Clean demo descriptions
on:
  push:
    branches: [docs/continuous-preview-v3]
    paths: [.github/workflows/clean-demo-copy.yml]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Remove production notes from localized project descriptions
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          slug=os.environ['GITHUB_REPOSITORY'].split('/')[-1]
          files={'kiri':{'README.md':'zh','README_ZH.md':'zh','README_EN.md':'en','README_JA.md':'ja'},'mimi':{'README.md':'zh','README_ZH.md':'zh','README_EN.md':'en','README_JA.md':'ja'},'satori':{'README.md':'en','README_ZH.md':'zh','README_JA.md':'ja'},'viva':{'README.md':'en','README_ZH.md':'zh'},'tick':{'README.md':'zh'}}[slug]
          copy={'kiri':('截图、标注、识别文字和录屏，在素材库里统一查看。','Capture, annotate, recognize text, and record your screen. Keep everything together in the library.','スクリーンショット・注釈・文字認識・画面録画を、ライブラリでまとめて管理。'),'mimi':('把正在播放的内容翻译成字幕，随时调整语言、字号和显示方式。','Translate what is playing into live subtitles, with language, size, and display controls close at hand.','再生中の音声を字幕に翻訳。言語・文字サイズ・表示方法をいつでも調整できます。'),'satori':('阅读 PDF，向 AI 提问、继续追问，再回看问答。','Read a PDF, ask a question, follow up, and revisit the conversation.','PDF を読みながら AI に質問し、追加の質問や回答の振り返りができます。'),'viva':('写 Markdown，切换编辑视图，用大纲、多标签和查找整理笔记。','Write Markdown, switch editing views, and organize notes with outlines, tabs, and search.','Markdown を書き、表示を切り替え、目次・タブ・検索でノートを整理できます。'),'tick':('设置任务、触发运行，再查看执行结果和日志。','Configure a task, run it, and inspect its results and logs.','タスクを設定・実行し、結果とログを確認できます。')}[slug]
          pattern=r'<!-- project-demo-v1 -->.*?<!-- /project-demo-v1 -->'
          for name,lang in files.items():
              p=Path(name);text=p.read_text(encoding='utf-8');assert len(re.findall(pattern,text,re.S))==1,name
              i={'zh':0,'en':1,'ja':2}[lang];heading=['演示','Demo','デモ'][i];watch=['观看视频','Watch video','動画を見る'][i]
              block=f'<!-- project-demo-v1 -->\n## {heading}\n\n[![{slug} — {heading}](docs/demos/preview.gif)](docs/demos/demo.mp4)\n\n[{watch}](docs/demos/demo.mp4)\n\n{copy[i]}\n<!-- /project-demo-v1 -->'
              p.write_text(re.sub(pattern,lambda _:block,text,flags=re.S),encoding='utf-8')
          if slug=='satori':
              p=Path('docs/status.md');p.write_text(p.read_text(encoding='utf-8')+'\n\n### 2026-09-06 · 精简演示说明\n\nREADME 演示区只保留功能介绍和视频入口；移除倍速、录制环境等制作说明。应用行为未改变。\n',encoding='utf-8')
          subprocess.run(['git','add','--',*files,*(['docs/status.md'] if slug=='satori' else [])],check=True)
          PY
          git rm -- .github/workflows/clean-demo-copy.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: simplify project demo descriptions'
          git push origin HEAD:refs/heads/docs/continuous-preview-v3
