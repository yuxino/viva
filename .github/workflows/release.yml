name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: macOS 15 arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: Windows 2025 x64
            os: windows-2025
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.24.0
          runtime: node@24.20.0
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        shell: bash
        run: node scripts/validate-updater-release.mjs --source-root . --tag "$GITHUB_REF_NAME"

      - name: Load release notes
        id: release-notes
        shell: bash
        run: |
          delimiter="VIVA_RELEASE_NOTES_$(date +%s%N)"
          {
            echo "body<<$delimiter"
            cat "docs/release-notes-v${GITHUB_REF_NAME#v}.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Test frontend
        run: pnpm test

      - name: Test release validation and updater signatures
        run: pnpm test:release

      - name: Build frontend
        run: pnpm build

      - name: Enforce renderer size budget
        run: pnpm check:size

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Test native core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check native application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint native application
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build signed bundles into draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Viva v__VERSION__
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: ${{ matrix.args }}

  verify-publish:
    name: Verify and publish
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02

      - name: Download complete draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Normalize and validate metadata, targets, assets, and signatures
        shell: bash
        run: node scripts/validate-updater-release.mjs --source-root . --directory release-assets --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --normalize true --hash-output release-assets/SHA256SUMS.txt

      - name: Upload normalized metadata and SHA-256 ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/latest.json release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish validated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest --draft=false --notes-file "docs/release-notes-v${version}.md"

      - name: Verify public updater feed and assets
        shell: bash
        run: node scripts/validate-updater-release.mjs --source-root . --directory release-assets --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --check-public true
